<h1 id="first-reinforce-experiment-many-samples-%E2%80%93-one-loss">First REINFORCE Experiment: Many samples – One loss</h1>
<ul>
<li>Many samples per run, but only a single global loss</li>
<li>Every sample in a run gets the same advantage → no differential signal to guide improvement</li>
<li>Result: no optimization</li>
</ul>
</section>

<h1 id="second-reinforce-experiment-many-samples-%E2%80%93-many-losses">Second REINFORCE Experiment: Many samples – Many losses</h1>
<ul>
<li>Each run gets its own loss (Wasserstein‑1D distance of its own point)</li>
<li>Per‑run advantage → gradient averaged across runs</li>
<li>Optimizes well until close to the target, where Wasserstein re‑ordering causes sudden jumps<br />
<em>(Future idea: fix the event order from the start to avoid those jumps)</em></li>
</ul>
</section>

<ul>

<h1 id="%CE%BC-and-%CE%B3-influence-on-fwhm-distributions">μ and γ influence on FWHM distributions</h1>

<li>Visual inspection to understand the degeneracy
<ul>
<li>Higher μ → more photons → narrower FWHM (thinner distribution)</li>
<li>Larger γ → wider line → thicker distribution (plus a shift)</li>
<li>The two effects can cancel: many (μ, γ) combinations give identical FWHM</li>
</ul>
</li>
</ul>
</section>

<h1 id="joint-optimization-with-fwhm-%CF%83-uncertainty">Joint Optimization with FWHM σ (uncertainty)</h1>
<p><strong>Key insight:</strong> the data contain uncertainties!</p>
<ul>
<li>Different (μ, γ) pairs can match the same FWHM but differ in their <em>FWHM uncertainty</em> (σ)</li>
<li>Example:
<ul>
<li>μ=20, γ=10 → few photons, large σ (uncertain FWHM)</li>
<li>μ=200, γ=5 → many photons, small σ (precise FWHM)</li>
</ul>
</li>
<li>Both hit the same FWHM target, but σ tells them apart</li>
</ul>
<p><strong>Solution:</strong> add a second term that matches the whole σ distribution</p>

33T274 430Q275 431 414 431H552Q553 430 555 429T559 427T562 425T565 422T567 420T569 416T570 412T571 407T572 401Q572 357 507 357Q500 357 490 357T476 358H416L421 348Q439 310 439 263Q439 153 359 71T184 -11ZM361 278Q361 358 276 358Q152 358 115 184Q114 180 114 178Q106 141 106 117Q106 67 131 47T188 26Q242 26 287 73Q316 103 334 153T356 233T361 278Z"></path></g></g></g></g></svg></mjx-container></p><p><strong>Gradients:</strong></p>
<ul>
<li>μ: REINFORCE with combined reward (FWHM + σ matching)</li>
<li>γ: implicit differentiation for FWHM + CRLB approximation for σ (dσ/dγ ≈ 2/√n)</li>
</ul>
<p><strong>Result:</strong> degeneracy broken — μ and γ converge closer to true values.</p>
<h3 id="sigma-optimisation-%E2%80%93-how-it-works">Sigma optimisation – how it works</h3>
<ul>
<li>σ comes from the Hessian of the log‑likelihood at the fit optimum</li>
<li>Loss: quantile‑aligned absolute error on both FWHM and σ</li>
<li>μ gradient: per‑run advantage = −|FWHMᵢ − target| − λ·|σᵢ − target_σ|<br />
∇μ = mean((advantage − baseline) · score)</li>
<li>γ gradient: sign(FWHM−target)·(dFWHM/dγ) + λ·sign(σ−target)·(2/√n)</li>
<li>μ controls σ mainly through photon count; γ controls FWHM through linewidth<br />
→ the two terms anchor different aspects, breaking the degeneracy</li>
</ul>
</section>
